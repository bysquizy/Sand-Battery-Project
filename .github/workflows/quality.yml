name: Python 3.13 research QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Numerical models and Streamlit page startup
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out project
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile all web pages and models
        run: python -m compileall -q streamlit_app.py home_app.py project_info.py project_version.py research_notes.py visuals.py visuals_advanced.py silo_visual.py pages engine
      - name: Static analysis (unused imports, undefined and invalid local names)
        run: python -m ruff check .
      - name: Validate installed dependency consistency
        run: python -m pip check
      - name: Numerical and web-entry tests
        run: python -m pytest -q
