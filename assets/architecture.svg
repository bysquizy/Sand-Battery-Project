<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
<title id="title">Sand Battery Studio numerical research workflow</title>
<desc id="desc">Five stages of the web-first research workflow: inputs, thermodynamic engine, science verification, computed visuals and provenance-aware publication.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091624"/><stop offset="1" stop-color="#122d3b"/></linearGradient><linearGradient id="tile" x2="0" y2="1"><stop stop-color="#203f51"/><stop offset="1" stop-color="#132733"/></linearGradient></defs>
<rect width="1120" height="320" rx="22" fill="url(#bg)"/>
<text x="40" y="55" fill="#eaf2f7" font-family="Arial, sans-serif" font-size="27" font-weight="bold">SAND BATTERY STUDIO</text>
<text x="41" y="83" fill="#92b9c4" font-family="Arial, sans-serif" font-size="14">A transparent research pipeline • Group 8 • Simulation, not measured hardware</text>
<g font-family="Arial,sans-serif">
<g transform="translate(35,119)"><rect width="194" height="146" rx="16" fill="url(#tile)" stroke="#4b7785"/><text x="19" y="35" font-size="14" fill="#69e0c7" font-weight="bold">01  INPUT</text><text x="19" y="69" fill="#fff" font-size="15">Active Scenario</text><text x="19" y="95" fill="#bdd0d9" font-size="12">Material • Geometry</text><text x="19" y="113" fill="#bdd0d9" font-size="12">Temperatures • MW</text></g>
<g transform="translate(251,119)"><rect width="194" height="146" rx="16" fill="url(#tile)" stroke="#4b7785"/><text x="19" y="35" font-size="14" fill="#69e0c7" font-weight="bold">02  SOLVE</text><text x="19" y="69" fill="#fff" font-size="15">Numerical engines</text><text x="19" y="95" fill="#bdd0d9" font-size="12">0-D • 1-D LTE / LTNE</text><text x="19" y="113" fill="#bdd0d9" font-size="12">Thermal pipes • UA</text></g>
<g transform="translate(467,119)"><rect width="194" height="146" rx="16" fill="url(#tile)" stroke="#4b7785"/><text x="19" y="35" font-size="14" fill="#f0c28b" font-weight="bold">03  VERIFY</text><text x="19" y="69" fill="#fff" font-size="15">Numerical checks</text><text x="19" y="95" fill="#bdd0d9" font-size="12">Balance • Bounds</text><text x="19" y="113" fill="#bdd0d9" font-size="12">Sensitivity • Cutoffs</text></g>
<g transform="translate(683,119)"><rect width="194" height="146" rx="16" fill="url(#tile)" stroke="#4b7785"/><text x="19" y="35" font-size="14" fill="#f0c28b" font-weight="bold">04  EXPLORE</text><text x="19" y="69" fill="#fff" font-size="15">Computed visuals</text><text x="19" y="95" fill="#bdd0d9" font-size="12">Axial 3D • Heatmaps</text><text x="19" y="113" fill="#bdd0d9" font-size="12">Ledger • Tradeoffs</text></g>
<g transform="translate(899,119)"><rect width="186" height="146" rx="16" fill="url(#tile)" stroke="#4b7785"/><text x="19" y="35" font-size="14" fill="#f0c28b" font-weight="bold">05  PUBLISH</text><text x="19" y="69" fill="#fff" font-size="15">Research export</text><text x="19" y="95" fill="#bdd0d9" font-size="12">HTML • PDF • JSON</text><text x="19" y="113" fill="#bdd0d9" font-size="12">Sources • Limitations</text></g>
